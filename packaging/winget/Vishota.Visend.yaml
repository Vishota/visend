# winget manifest template (phase 2).
# Placeholders (__VERSION__, __SHA256__, __ZIPURL__) are substituted by CI.
# Requires the portable zip produced by the node SEA/pkg bundling job and a
# PR to microsoft/winget-pkgs.
#
# yamllint disable
Id: vishota.visend.__VERSION__
Version: __VERSION__
PackageName: visend
Publisher: vishota
License: MIT
ShortDescription: visend is a fast cross-platform tool way to send anything to telegram
PackageUrl: https://github.com/vishota/visend
Moniker: visend
Tags:
  - telegram
  - cli
  - send
  - files
Installers:
  - Architecture: x64
    InstallerUrl: __ZIPURL__
    InstallerType: zip
    InstallerSha256: __SHA256__
    NestedInstallerType: portable
    NestedInstallerFiles:
      - RelativeFilePath: visend.exe
        PortableCommandAlias: visend
ManifestType: singleton
ManifestVersion: 1.6.0
